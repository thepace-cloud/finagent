<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinAgent · 财经问答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #eef1f5; display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 760px; height: 100%;
    display: flex; flex-direction: column; background: #fff;
    box-shadow: 0 0 40px rgba(0,0,0,.06);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid #e5e9f0; background: #fff;
  }
  .title { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; border-radius: 10px; background: #2563eb;
    color: #fff; font-weight: 700; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 17px; color: #1a2233; }
  .sub { font-size: 12px; color: #8a94a6; margin-top: 2px; }
  .pill {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: #eef1f5; color: #8a94a6;
  }
  .pill.ok { background: #e8f7ee; color: #15803d; }
  .pill.warn { background: #fef3e2; color: #b45309; }

  main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #f4f6f9; color: #1a2233; border-bottom-left-radius: 4px; }
  .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500;
  }
  .badge.rag { background: #e0ecff; color: #1d4ed8; }
  .badge.analysis { background: #f1e8ff; color: #7c3aed; }
  .badge.retry { background: #fdecec; color: #b91c1c; }
  .badge.compare { background: #e6f6f2; color: #0f766e; }
  .cmp-wrap { overflow-x: auto; margin: 8px 0; }
  table.cmp { border-collapse: collapse; font-size: 13px; line-height: 1.6; width: 100%; }
  table.cmp th, table.cmp td {
    border: 1px solid #dfe5ee; padding: 6px 9px;
    text-align: left; vertical-align: top;
  }
  table.cmp th { background: #f0f4fa; white-space: nowrap; }
  .cite {
    font-family: Consolas, monospace; font-size: 12px;
    background: #e8f7ee; color: #15803d; border-radius: 4px; padding: 0 4px;
    cursor: pointer;
  }
  .cite-panel {
    position: fixed; top: 0; right: 0; height: 100%;
    width: 360px; max-width: 90vw;
    background: #fff; box-shadow: -6px 0 24px rgba(0,0,0,.12);
    transform: translateX(100%);                        /* 藏到右门外 */
    transition: transform .25s ease;
    display: flex; flex-direction: column;
    z-index: 10;
  }
  .cite-panel.open { transform: translateX(0%); }      /* 滑回门内 */
  .cite-panel-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid #e5e9f0; font-weight: 600;
  }
  .cite-panel-body {
    padding: 16px; overflow-y: auto; font-size: 13px;
    line-height: 1.8; white-space: pre-wrap;
  }
  #citeClose { border: none; background: none; font-size: 16px; cursor: pointer; color: #8a94a6; }

  .dots::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  .chips { display: flex; gap: 8px; padding: 0 20px 10px; flex-wrap: wrap; }
  .chips button {
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid #d7dde8; background: #fff; color: #47546a; cursor: pointer;
  }
  .chips button:hover { border-color: #2563eb; color: #2563eb; }

  footer { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid #e5e9f0; }
  footer input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #d7dde8;
    font-size: 14px; outline: none;
  }
  footer input:focus { border-color: #2563eb; }
  footer button {
    padding: 0 22px; border: none; border-radius: 10px; background: #2563eb;
    color: #fff; font-size: 14px; cursor: pointer;
  }
  footer button:disabled { background: #a8bde8; cursor: default; }
  .msg.assistant .bubble.refused {
    background: #fdecec; color: #b91c1c; border-bottom-left-radius: 4px;
  }

  /* ── 适配测评（M2）：问卷选项 + 推荐卡 ── */
  .badge.assess { background: #fff4e5; color: #c2410c; }
  .qstep { font-size: 11px; color: #8a94a6; margin-bottom: 4px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .opts button {
    font-size: 13px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid #d7dde8; background: #fff; color: #1a2233;
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  .opts button:hover { border-color: #2563eb; color: #2563eb; }
  .qcancel {
    font-size: 12px; color: #8a94a6; cursor: pointer; margin-top: 10px;
    display: inline-block;
  }
  .qcancel:hover { color: #b91c1c; }
  .acard .awin {
    background: #f0f7ff; border: 1px solid #cfe1fb; border-radius: 12px;
    padding: 12px;
  }
  .acard .awin-name {
    font-weight: 700; font-size: 15px; color: #1d4ed8;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .acard .ascore { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .acard .ascorebar {
    height: 6px; background: #dbe7f8; border-radius: 3px; margin: 8px 0 2px;
  }
  .acard .ascorebar i { display: block; height: 100%; background: #2563eb; border-radius: 3px; }
  .acard .asec { font-size: 12px; color: #8a94a6; font-weight: 600; margin: 10px 0 4px; }
  .acard .alist { list-style: none; }
  .acard .alist li {
    font-size: 13px; line-height: 1.8; padding-left: 14px; position: relative;
  }
  .acard .alist li::before { content: "•"; position: absolute; left: 2px; color: #2563eb; }
  .acard .alist.concerns li::before { content: "!"; color: #b45309; font-weight: 700; }
  .acard .aest {
    margin-top: 10px; background: #fff; border: 1px dashed #cfe1fb;
    border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.8;
  }
  .acard .anone {
    background: #fef6ec; border: 1px solid #f3ddbb; border-radius: 12px;
    padding: 12px; font-size: 13px; line-height: 1.8; color: #92400e;
  }
  .acard .arow {
    font-size: 13px; line-height: 1.9; color: #47546a;
    padding: 4px 0; border-bottom: 1px dashed #eef1f5;
  }
  .acard .arow b { color: #1a2233; }
  .acard .anote { margin-top: 10px; font-size: 11px; color: #8a94a6; line-height: 1.6; }
  @media (max-width: 640px) {
    .bubble { max-width: 92%; }
    footer input { font-size: 16px; }
    footer { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }

  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <div class="logo">F</div>
      <div>
        <h1>FinAgent</h1>
        <div class="sub">财经问答 Agent · 检索 / 对比 / 测评 / 工具调用</div>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <a class="pill" href="/stats" style="text-decoration:none;">运营看板</a>
      <div id="health" class="pill">连接中</div>
    </div>
  </header>

  <main id="chat">
    <div class="msg assistant">
      <div class="bubble">你好，我是 FinAgent。可以问我贷款产品规则（如「安居贷的申请条件」），对比产品（如「安居贷和乐享贷的区别」），查股票行情（如「贵州茅台的股价」），也可以点下方 <b>📋 适配测评</b>，答几道题就告诉你哪款贷款适合你。点击试试：<span class="cite">[anju_loan P1]</span></div>
    </div>
  </main>

  <div class="chips" id="chips">
    <button class="assess" style="border-color:#c2410c; color:#c2410c; background:#fff8f1;">📋 适配测评：我该选哪款？</button>
    <button>安居贷的申请条件是什么？</button>
    <button>安居贷和乐享贷的申请条件有什么区别？</button>
    <button>这几款贷款哪个年龄限制更宽松？</button>
    <button>贵州茅台的股价怎么样？</button>
  </div>

  <footer>
    <input id="input" placeholder="输入问题，回车发送…" autocomplete="off">
    <button id="send">发送</button>
  </footer>
<div id="citePanel" class="cite-panel">
  <div class="cite-panel-head">
    <span id="citeTitle">原文</span>
    <button id="citeClose">✕</button>
  </div>
  <div id="citeBody" class="cite-panel-body">（原文将显示在这里）</div>
</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const USER = "demo_user";
  const SESSION = "web_" + Date.now().toString(36);   // 每次打开页面 = 新会话（记忆在会话内生效）

  // 健康状态：右上角显示真库/降级
  fetch("/health").then(r => r.json()).then(h => {
    const redis = (h.backend || "").startsWith("redis://");
    const mysql = (h.db || "").includes("mysql");
    const el = $("health");
    el.textContent = (redis ? "Redis ✓  " : "内存降级  ") + (mysql ? "MySQL ✓" : "SQLite");
    el.className = "pill " + (redis && mysql ? "ok" : "warn");
  }).catch(() => {
    $("health").textContent = "服务未连接";
    $("health").className = "pill warn";
  });

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 行内管线：**加粗** → <strong>，[anju_loan P2] → 绿色引用徽章
  function inline(s) {
    s = escapeHtml(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return s.replace(/\[([a-z_]+ P\d+)\]/g, '<span class="cite">[$1]</span>');
  }

  // 渲染：普通行走行内管线；连续「|」开头的行 = 一张 markdown 表 → 真表格
  // （对比路径的对照表在这里落地，单元格里的引用徽章照样可点）
  function render(text) {
    let h = "", table = [];
    const flushTable = () => {
      if (!table.length) return;
      const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)); // 丢 |---| 对齐行
      const cells = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "")
                          .split("|").map(c => inline(c.trim()));
      const trs = rows.map((r, i) => {
        const tag = i === 0 ? "th" : "td";        // 首行 = 表头
        return "<tr>" + cells(r).map(c => `<${tag}>${c}</${tag}>`).join("") + "</tr>";
      });
      h += '<div class="cmp-wrap"><table class="cmp">' + trs.join("") + "</table></div>";
      table = [];
    };
    for (const line of text.split("\n")) {
      if (line.trim().startsWith("|")) table.push(line);
      else { flushTable(); h += inline(line) + "\n"; }
    }
    flushTable();
    return h;
  }

  function addMsg(role, html) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = '<div class="bubble">' + html + "</div>";
    $("chat").appendChild(div);
    $("chat").scrollTop = $("chat").scrollHeight;
    return div;
  }

  let busy = false;
  async function send(text) {
    text = text.trim();
    if (!text || busy || assessFlow) return;
    busy = true; $("send").disabled = true;
    addMsg("user", escapeHtml(text));
    const bubble = addMsg("assistant", '<span class="dots">思考中</span>')
      .querySelector(".bubble");
    const paint = () => { $("chat").scrollTop = $("chat").scrollHeight; };
    try {
      const r = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: USER, session_id: SESSION, message: text }),
      });
      const reader = r.body.getReader();     // ① 吸管
      const dec = new TextDecoder();         // ② 翻译官
      let buf = "", full = "", route = "", refused = false;
      while (true) {
        const { done, value } = await reader.read();   // ③ 吸一口（没水就冻结等）
        if (done) break;
        buf += dec.decode(value);            // 这一口倒进缓冲桌
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {       // 桌上凑齐几封拆几封
          const line = buf.slice(0, i);      // 取出一封（切在封口空行处）
          buf = buf.slice(i + 2);            // 半封的留在桌上等下一口
          if (!line.startsWith("data: ")) continue;
          const ev = JSON.parse(line.slice(6));        // ④ 撕封皮读信
          if (ev.type === "delta") {
            full += ev.text;                 // 信里的字并进全文
            bubble.textContent = full;       // ⑤ 上屏——打字机！
            paint();
          } else if (ev.type === "meta") {
            route = ev.route;                // 第一封：本趟走哪条路
          } else if (ev.type === "retry") {
            full = "";                       // 这版作废：清屏，重新流
            bubble.innerHTML = '<span class="dots">校验未过，重试中</span>';
          } else if (ev.type === "refused") {
            full = ev.text; refused = true;  // 降级文案（后端连文案都给了）
            bubble.textContent = full;
          } else if (ev.type === "done") {
            // 终稿化装：流式期间素颜文字，此刻上妆（加粗/引用徽章/对照表/路线徽章）
            const ROUTE_LABELS = { rag: "RAG 检索", compare: "产品对比",
                                   analysis: "工具调用" };
            const badges =
              '<span class="badge ' + route + '">' +
              (ROUTE_LABELS[route] || route) + "</span>" +
              (ev.attempts > 1 ? '<span class="badge retry">校验重试 ×' + (ev.attempts - 1) + "</span>" : "");
            bubble.innerHTML = render(full) + '<div class="meta">' + badges + "</div>";
            if (refused) bubble.classList.add("refused");
            paint();
          }
        }
      }
    } catch (e) {
      bubble.textContent = "请求失败：" + e;
    }
    paint();
    busy = false; $("send").disabled = false;
  }

  $("send").onclick = () => { send($("input").value); $("input").value = ""; };
  $("citeClose").onclick = () => { $("citePanel").classList.remove("open"); };
  $("input").onkeydown = e => {
    if (e.key === "Enter") { send($("input").value); $("input").value = ""; }
  };
  $("chips").onclick = e => {
    if (e.target.tagName !== "BUTTON") return;
    if (e.target.classList.contains("assess")) { startAssess(); return; }
    send(e.target.textContent);
  };
  // Step 5：点徽章 → 从后端 /cite 取真原文装进面板
  async function openCite(badge) {
    const m = badge.textContent.match(/\[([a-z_]+) P(\d+)\]/);   // [anju_loan P1] → 拆出 doc、page
    if (!m) return;
    const doc = m[1], page = m[2];
    $("citePanel").classList.add("open");          // 先开门：用户立刻看到响应
    $("citeTitle").textContent = `[${doc} P${page}]`;
    $("citeBody").textContent = "加载原文中…";      // 网络往返期间给个占位
    try {
      const r = await fetch(`/cite?doc=${doc}&page=${page}`);   // 你后端写的接口
      const b = await r.json();
      $("citeBody").textContent = b.chunks.length
        ? b.chunks.map(c => c.text).join("\n\n————\n\n")       // 多块用分隔线拼
        : "未找到对应原文。";
    } catch (e) {
      $("citeBody").textContent = "原文加载失败：" + e;
    }
  }

  $("chat").addEventListener("click", e => {
    if (e.target.classList.contains("cite")) openCite(e.target);
    if (e.target.classList.contains("qcancel")) cancelAssess();
    const optBtn = e.target.closest && e.target.closest(".opts button");
    if (optBtn && assessFlow) pickOption(optBtn);
  });

  // ── 适配测评（M2）：问卷流走独立 /assess 端点，不进 /chat 主链路 ──
  // 全程选择题（不敲字）：答案 value 直接是打分规则的输入键，零解析歧义
  let assessFlow = null;

  async function startAssess() {
    if (busy || assessFlow) return;
    let d;
    try {
      const r = await fetch("/assess");
      d = await r.json();
    } catch (e) { addMsg("assistant", "测评服务未连接：" + e); return; }
    assessFlow = { questions: d.questions, answers: {}, i: 0 };
    $("input").disabled = true; $("send").disabled = true;
    addMsg("assistant",
      "<b>📋 贷款适配测评</b><br>几个问题（约 30 秒），答完给您一张带说明书出处的推荐卡。<br>" +
      '<span class="qcancel">✕ 取消测评</span>');
    askNext();
  }

  function askNext() {
    const st = assessFlow;
    while (st.i < st.questions.length) {          // 条件题：用途不命中就跳过
      const q = st.questions[st.i];
      if (!q.show_if || q.show_if.purpose === st.answers.purpose) break;
      st.i++;
    }
    if (st.i >= st.questions.length) return finishAssess();
    const q = st.questions[st.i];
    const opts = q.options.map(o =>
      `<button data-v="${o.value}">${escapeHtml(o.label)}</button>`).join("");
    addMsg("assistant",
      `<div class="qstep">第 ${st.i + 1} 题 · 适配测评</div>${escapeHtml(q.text)}` +
      `<div class="opts">${opts}</div>`);
  }

  function pickOption(btn) {
    const st = assessFlow;
    const q = st.questions[st.i];
    const opt = q.options.find(o => o.value === btn.dataset.v);
    if (!opt) return;
    st.answers[q.id] = opt.value;
    addMsg("user", escapeHtml(opt.label));
    btn.parentElement.remove();                   // 答过的题收走选项，留下问题
    st.i++;
    askNext();
  }

  function cancelAssess() {
    if (!assessFlow) return;
    assessFlow = null;
    document.querySelectorAll(".opts").forEach(o => o.remove());
    $("input").disabled = false; $("send").disabled = false;
    addMsg("assistant", "已取消测评。点下方「📋 适配测评」可随时重新开始。");
  }

  async function finishAssess() {
    const bubble = addMsg("assistant",
      '<span class="dots">正在测算（规则打分，不经大模型，毫秒级）</span>')
      .querySelector(".bubble");
    try {
      const r = await fetch("/assess", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answers: assessFlow.answers }),
      });
      bubble.innerHTML = renderCard(await r.json());
    } catch (e) {
      bubble.textContent = "测评失败：" + e;
    }
    assessFlow = null;
    $("input").disabled = false; $("send").disabled = false;
    $("chat").scrollTop = $("chat").scrollHeight;
  }

  const aLi = it => "<li>" + inline(it.text) +
      ' <span class="cite">[' + it.cite + ']</span></li>';

  // 推荐卡：首选（匹配度条+理由+顾虑+月供估算）→ 其他产品为何不是首选 → 方法注脚。
  // 引用徽章沿用 [doc PN] 格式 → inline() 出来的徽章自动接 /cite 原文面板
  function renderCard(r) {
    const win = r.products.find(p => p.company === r.winner);
    let h = '<div class="acard"><div class="ahead">📋 ' + escapeHtml(r.headline) + '</div>';
    if (win) {
      h += '<div class="awin"><div class="awin-name"><span>🏆 首选推荐：' +
           escapeHtml(win.name) + '</span><span class="ascore">匹配度 ' +
           win.score + '/100</span></div>' +
           '<div class="ascorebar"><i style="width:' + win.score + '%"></i></div>' +
           '<div class="asec">推荐理由</div><ul class="alist">' +
           win.reasons.map(aLi).join("") + "</ul>";
      if (win.concerns.length) {
        h += '<div class="asec">需要注意</div><ul class="alist concerns">' +
             win.concerns.map(aLi).join("") + "</ul>";
      }
      if (win.estimate) {
        const e = win.estimate;
        h += '<div class="aest">💰 估算月供 ≈ <b>¥' + e.monthly.toLocaleString() +
             "</b>/月<br>口径：" + e.amount_wan + " 万 · " + escapeHtml(e.term_label) +
             " · " + escapeHtml(e.base_note) + " " + e.base + "% + 期限溢价 " +
             e.premium + "% = " + e.rate + "% · 等额本息 " +
             '<span class="cite">[' + e.cite + ']</span> <span class="cite">[' +
             e.formula_cite + ']</span>；实际以银行审批为准</div>';
      }
      h += '</div><div class="aother"><div class="asec">其他产品为什么不是首选</div>';
    } else {
      h += '<div class="anone">按您的情况，三款产品目前均不适合（各有原因，见下）' +
           '——建议携带资料到银行网点咨询人工客服。</div>' +
           '<div class="aother"><div class="asec">逐款说明</div>';
    }
    for (const p of r.products) {
      if (win && p.company === win.company) continue;
      const g = p.gates[0] || { text: "", cite: p.reasons[0].cite };
      h += '<div class="arow"><b>' + escapeHtml(p.name) + "</b> — " +
           (p.eligible ? "匹配度 " + p.score + "/100，可作备选"
                       : "不适合：" + inline(g.text)) +
           ' <span class="cite">[' + g.cite + ']</span></div>';
    }
    return h + '</div><div class="anote">' + escapeHtml(r.method) + "</div></div>";
  }
</script>
</body>
</html>
