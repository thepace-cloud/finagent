<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinAgent · 财经问答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #eef1f5; display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 760px; height: 100%;
    display: flex; flex-direction: column; background: #fff;
    box-shadow: 0 0 40px rgba(0,0,0,.06);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid #e5e9f0; background: #fff;
  }
  .title { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; border-radius: 10px; background: #2563eb;
    color: #fff; font-weight: 700; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 17px; color: #1a2233; }
  .sub { font-size: 12px; color: #8a94a6; margin-top: 2px; }
  .pill {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: #eef1f5; color: #8a94a6;
  }
  .pill.ok { background: #e8f7ee; color: #15803d; }
  .pill.warn { background: #fef3e2; color: #b45309; }

  main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #f4f6f9; color: #1a2233; border-bottom-left-radius: 4px; }
  .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500;
  }
  .badge.rag { background: #e0ecff; color: #1d4ed8; }
  .badge.analysis { background: #f1e8ff; color: #7c3aed; }
  .badge.retry { background: #fdecec; color: #b91c1c; }
  .cite {
    font-family: Consolas, monospace; font-size: 12px;
    background: #e8f7ee; color: #15803d; border-radius: 4px; padding: 0 4px;
    cursor: pointer;
  }
  .cite-panel {
    position: fixed; top: 0; right: 0; height: 100%;
    width: 360px; max-width: 90vw;
    background: #fff; box-shadow: -6px 0 24px rgba(0,0,0,.12);
    transform: translateX(100%);                        /* 藏到右门外 */
    transition: transform .25s ease;
    display: flex; flex-direction: column;
    z-index: 10;
  }
  .cite-panel.open { transform: translateX(0%); }      /* 滑回门内 */
  .cite-panel-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid #e5e9f0; font-weight: 600;
  }
  .cite-panel-body {
    padding: 16px; overflow-y: auto; font-size: 13px;
    line-height: 1.8; white-space: pre-wrap;
  }
  #citeClose { border: none; background: none; font-size: 16px; cursor: pointer; color: #8a94a6; }

  .dots::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  .chips { display: flex; gap: 8px; padding: 0 20px 10px; flex-wrap: wrap; }
  .chips button {
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid #d7dde8; background: #fff; color: #47546a; cursor: pointer;
  }
  .chips button:hover { border-color: #2563eb; color: #2563eb; }

  footer { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid #e5e9f0; }
  footer input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #d7dde8;
    font-size: 14px; outline: none;
  }
  footer input:focus { border-color: #2563eb; }
  footer button {
    padding: 0 22px; border: none; border-radius: 10px; background: #2563eb;
    color: #fff; font-size: 14px; cursor: pointer;
  }
  footer button:disabled { background: #a8bde8; cursor: default; }
  .msg.assistant .bubble.refused {
    background: #fdecec; color: #b91c1c; border-bottom-left-radius: 4px;
  }
  @media (max-width: 640px) {
    .bubble { max-width: 92%; }
    footer input { font-size: 16px; }
    footer { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }

  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <div class="logo">F</div>
      <div>
        <h1>FinAgent</h1>
        <div class="sub">财经问答 Agent · RAG 检索 + 工具调用 + 记忆</div>
      </div>
    </div>
    <div id="health" class="pill">连接中</div>
  </header>

  <main id="chat">
    <div class="msg assistant">
      <div class="bubble">你好，我是 FinAgent。可以问我贷款产品规则（如「安居贷的申请条件」），也可以查股票行情（如「贵州茅台的股价」）。点击试试：<span class="cite">[anju_loan P1]</span></div>
    </div>
  </main>

  <div class="chips" id="chips">
    <button>安居贷的申请条件是什么？</button>
    <button>它的首付比例和额度是多少？</button>
    <button>贵州茅台的股价怎么样？</button>
  </div>

  <footer>
    <input id="input" placeholder="输入问题，回车发送…" autocomplete="off">
    <button id="send">发送</button>
  </footer>
<div id="citePanel" class="cite-panel">
  <div class="cite-panel-head">
    <span id="citeTitle">原文</span>
    <button id="citeClose">✕</button>
  </div>
  <div id="citeBody" class="cite-panel-body">（原文将显示在这里）</div>
</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const USER = "demo_user";
  const SESSION = "web_" + Date.now().toString(36);   // 每次打开页面 = 新会话（记忆在会话内生效）

  // 健康状态：右上角显示真库/降级
  fetch("/health").then(r => r.json()).then(h => {
    const redis = (h.backend || "").startsWith("redis://");
    const mysql = (h.db || "").includes("mysql");
    const el = $("health");
    el.textContent = (redis ? "Redis ✓  " : "内存降级  ") + (mysql ? "MySQL ✓" : "SQLite");
    el.className = "pill " + (redis && mysql ? "ok" : "warn");
  }).catch(() => {
    $("health").textContent = "服务未连接";
    $("health").className = "pill warn";
  });

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 渲染：**加粗** → <strong>，[anju_loan P2] → 绿色引用徽章
  function render(text) {
    let h = escapeHtml(text);
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\[([a-z_]+ P\d+)\]/g, '<span class="cite">[$1]</span>');
    return h;
  }

  function addMsg(role, html) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = '<div class="bubble">' + html + "</div>";
    $("chat").appendChild(div);
    $("chat").scrollTop = $("chat").scrollHeight;
    return div;
  }

  let busy = false;
  async function send(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; $("send").disabled = true;
    addMsg("user", escapeHtml(text));
    const bubble = addMsg("assistant", '<span class="dots">思考中</span>')
      .querySelector(".bubble");
    const paint = () => { $("chat").scrollTop = $("chat").scrollHeight; };
    try {
      const r = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: USER, session_id: SESSION, message: text }),
      });
      const reader = r.body.getReader();     // ① 吸管
      const dec = new TextDecoder();         // ② 翻译官
      let buf = "", full = "", route = "", refused = false;
      while (true) {
        const { done, value } = await reader.read();   // ③ 吸一口（没水就冻结等）
        if (done) break;
        buf += dec.decode(value);            // 这一口倒进缓冲桌
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {       // 桌上凑齐几封拆几封
          const line = buf.slice(0, i);      // 取出一封（切在封口空行处）
          buf = buf.slice(i + 2);            // 半封的留在桌上等下一口
          if (!line.startsWith("data: ")) continue;
          const ev = JSON.parse(line.slice(6));        // ④ 撕封皮读信
          if (ev.type === "delta") {
            full += ev.text;                 // 信里的字并进全文
            bubble.textContent = full;       // ⑤ 上屏——打字机！
            paint();
          } else if (ev.type === "meta") {
            route = ev.route;                // 第一封：本趟走哪条路
          } else if (ev.type === "retry") {
            full = "";                       // 这版作废：清屏，重新流
            bubble.innerHTML = '<span class="dots">校验未过，重试中</span>';
          } else if (ev.type === "refused") {
            full = ev.text; refused = true;  // 降级文案（后端连文案都给了）
            bubble.textContent = full;
          } else if (ev.type === "done") {
            // 终稿化装：流式期间素颜文字，此刻上妆（加粗/引用徽章/路线徽章）
            const badges =
              '<span class="badge ' + route + '">' +
              (route === "rag" ? "RAG 检索" : "工具调用") + "</span>" +
              (ev.attempts > 1 ? '<span class="badge retry">校验重试 ×' + (ev.attempts - 1) + "</span>" : "");
            bubble.innerHTML = render(full) + '<div class="meta">' + badges + "</div>";
            if (refused) bubble.classList.add("refused");
            paint();
          }
        }
      }
    } catch (e) {
      bubble.textContent = "请求失败：" + e;
    }
    paint();
    busy = false; $("send").disabled = false;
  }

  $("send").onclick = () => { send($("input").value); $("input").value = ""; };
  $("citeClose").onclick = () => { $("citePanel").classList.remove("open"); };
  $("input").onkeydown = e => {
    if (e.key === "Enter") { send($("input").value); $("input").value = ""; }
  };
  $("chips").onclick = e => { if (e.target.tagName === "BUTTON") send(e.target.textContent); };
  // Step 5：点徽章 → 从后端 /cite 取真原文装进面板
  async function openCite(badge) {
    const m = badge.textContent.match(/\[([a-z_]+) P(\d+)\]/);   // [anju_loan P1] → 拆出 doc、page
    if (!m) return;
    const doc = m[1], page = m[2];
    $("citePanel").classList.add("open");          // 先开门：用户立刻看到响应
    $("citeTitle").textContent = `[${doc} P${page}]`;
    $("citeBody").textContent = "加载原文中…";      // 网络往返期间给个占位
    try {
      const r = await fetch(`/cite?doc=${doc}&page=${page}`);   // 你后端写的接口
      const b = await r.json();
      $("citeBody").textContent = b.chunks.length
        ? b.chunks.map(c => c.text).join("\n\n————\n\n")       // 多块用分隔线拼
        : "未找到对应原文。";
    } catch (e) {
      $("citeBody").textContent = "原文加载失败：" + e;
    }
  }

  $("chat").addEventListener("click", e => {
    if (e.target.classList.contains("cite")) openCite(e.target);
  });
</script>
</body>
</html>
